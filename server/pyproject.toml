[project]
name = "dark-war-survival"
version = "0.1.0"
description = "Dark War Survival - 연맹 전략 관리 도구"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "click>=8.1.0",
    "easyocr>=1.7.0",
    "pandas>=2.1.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
dws = "src.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
